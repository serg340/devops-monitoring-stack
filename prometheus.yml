global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitoring_stack: devops-monitoring-stack

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "node"
    static_configs:
      - targets:
          - "node_exporter:9100" # Local monitoring host
          - "172.17.2.20:9100"   # GitLab server
          - "172.17.2.22:9100"   # App server
          - "172.17.2.23:9100"   # Production server

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"      # Local monitoring host
          - "172.17.2.20:8080"   # GitLab server
          - "172.17.2.22:8080"   # App server
          - "172.17.2.23:8080"   # Production server
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_cpu_usage_seconds_total|container_memory_usage_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total'
        action: keep

  - job_name: "mysql"
    static_configs:
      - targets:
          - "mysqld_exporter:9104"
