rule_files:
  - ../alert_rules.yml

evaluation_interval: 1m

tests:
  - name: Prometheus target down
    interval: 1m
    input_series:
      - series: 'up{job="node", instance="172.17.2.20:9100", host="gitlab", role="gitlab"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: PrometheusTargetDown
        exp_alerts:
          - exp_labels:
              instance: "172.17.2.20:9100"
              job: node
              host: gitlab
              role: gitlab
              severity: critical
            exp_annotations:
              summary: "Prometheus target is down"
              description: "Target 172.17.2.20:9100 (job=node, host=gitlab) has been unreachable for more than 2 minutes."

  - name: Host CPU above 90 percent
    interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{job="node", instance="172.17.2.22:9100", host="app", role="application", cpu="0", mode="idle"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostHighCPU
        exp_alerts:
          - exp_labels:
              instance: "172.17.2.22:9100"
              host: app
              role: application
              severity: warning
            exp_annotations:
              summary: "High CPU usage on app"
              description: "CPU usage on 172.17.2.22:9100 has been above 90% for 10 minutes."

  - name: Available memory below 10 percent
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node", instance="172.17.2.23:9100", host="production", role="production"}'
        values: '5+0x10'
      - series: 'node_memory_MemTotal_bytes{job="node", instance="172.17.2.23:9100", host="production", role="production"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostLowMemory
        exp_alerts:
          - exp_labels:
              instance: "172.17.2.23:9100"
              job: node
              host: production
              role: production
              severity: warning
            exp_annotations:
              summary: "Low available memory on production"
              description: "Available memory on 172.17.2.23:9100 has been below 10% for 5 minutes."

  - name: Filesystem free space below 10 percent
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node", instance="172.17.2.20:9100", host="gitlab", role="gitlab", fstype="ext4", mountpoint="/"}'
        values: '5+0x15'
      - series: 'node_filesystem_size_bytes{job="node", instance="172.17.2.20:9100", host="gitlab", role="gitlab", fstype="ext4", mountpoint="/"}'
        values: '100+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostFilesystemAlmostFull
        exp_alerts:
          - exp_labels:
              instance: "172.17.2.20:9100"
              job: node
              host: gitlab
              role: gitlab
              fstype: ext4
              mountpoint: /
              severity: warning
            exp_annotations:
              summary: "Filesystem almost full on gitlab"
              description: "Filesystem / on 172.17.2.20:9100 has less than 10% free space."

  - name: Alertmanager target down
    interval: 1m
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093", host="monitoring", role="monitoring"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: AlertmanagerDown
        exp_alerts:
          - exp_labels:
              instance: "alertmanager:9093"
              job: alertmanager
              host: monitoring
              role: monitoring
              severity: critical
            exp_annotations:
              summary: "Alertmanager is down"
              description: "Prometheus cannot scrape Alertmanager for more than 2 minutes."
