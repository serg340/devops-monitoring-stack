groups:
  - name: host-health
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: 'Target {{ $labels.instance }} (job={{ $labels.job }}, host={{ $labels.host }}) has been unreachable for more than 2 minutes.'

      - alert: HostHighCPU
        expr: |
          100 * (1 - avg by (instance, host, role) (
            rate(node_cpu_seconds_total{job="node", mode="idle"}[5m])
          )) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.host }}"
          description: 'CPU usage on {{ $labels.instance }} has been above 90% for 10 minutes.'

      - alert: HostLowMemory
        expr: |
          100 * (
            node_memory_MemAvailable_bytes{job="node"}
            /
            node_memory_MemTotal_bytes{job="node"}
          ) < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low available memory on {{ $labels.host }}"
          description: 'Available memory on {{ $labels.instance }} has been below 10% for 5 minutes.'

      - alert: HostFilesystemAlmostFull
        expr: |
          100 * (
            node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|ramfs|proc|sysfs|devtmpfs"}
            /
            node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|ramfs|proc|sysfs|devtmpfs"}
          ) < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem almost full on {{ $labels.host }}"
          description: 'Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free space.'

  - name: monitoring-health
    rules:
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Prometheus cannot scrape Alertmanager for more than 2 minutes."
